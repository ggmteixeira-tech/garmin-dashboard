<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="dark">
<title>Garmin Performance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  color-scheme:dark;
  --bg:#0a0a0f; --card:#13131c; --card2:#191924; --ink:#f0efec; --ink2:#c3c2b7; --muted:#898781;
  --grid:#262631; --axis:#3a3a46; --line:rgba(255,255,255,.10);
  --z1:#3987e5; --z2:#199e70; --z3:#c98500; --z4:#9085e9; --z5:#e66767;
  --rec:#d55181; --load:#d95926;
  --good:#0ca30c; --warn:#fab219; --crit:#d03b3b;
  --font:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --head:'Bebas Neue','DM Sans',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);padding:env(safe-area-inset-top) 0 40px}
h1,h2,h3{margin:0;font-weight:400}
.wrap{max-width:1120px;margin:0 auto;padding:0 16px}
/* gate */
#gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
#gate[hidden],#app[hidden],#tip[hidden]{display:none}
#gate form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;width:100%;max-width:380px}
#gate h1{font:400 34px/1 var(--head);letter-spacing:.04em;margin-bottom:6px}
#gate p{color:var(--ink2);margin:0 0 18px}
input[type=password],input[type=text].off{width:100%;background:var(--bg);border:1px solid var(--axis);border-radius:8px;color:var(--ink);padding:12px;font:16px var(--font)}
input.off{position:absolute;left:-9999px;opacity:0}
button{font:500 14px var(--font);color:var(--ink);background:var(--card2);border:1px solid var(--axis);border-radius:8px;padding:9px 14px;cursor:pointer;min-height:40px}
button:hover{border-color:var(--muted)} button:focus-visible,select:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--z1);outline-offset:2px}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink);width:100%;margin-top:12px;font-weight:700}
button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
#err{color:#ff8a8a;margin-top:10px;min-height:20px;font-size:13px}
/* header + filters */
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px;padding:22px 0 8px}
header.top h1{font:400 40px/1 var(--head);letter-spacing:.04em}
.sub{color:var(--muted);font-size:13px}
.stale{color:var(--warn);font-weight:700}
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px 0 14px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:5}
.filters label{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.06em}
select{background:var(--card2);color:var(--ink);border:1px solid var(--axis);border-radius:8px;padding:9px 10px;font:14px var(--font);min-height:40px;max-width:100%}
.chips{display:flex;gap:6px}
/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:0 0 12px;min-width:0}
.card h2{font:400 24px/1 var(--head);letter-spacing:.05em}
.card h3{font:500 14px var(--font);color:var(--ink)}
.card .hd{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:10px}
.card .hd .sub{margin-top:2px}
.tbtn{padding:4px 10px;min-height:30px;font-size:12px;color:var(--ink2)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:12px}
.grid2>.card{margin:0}
.sec{margin:22px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec h2{font:400 28px/1 var(--head);letter-spacing:.05em}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card2);border-radius:10px;padding:12px}
.tile .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em}
.tile .v{font:400 34px/1.05 var(--head);letter-spacing:.03em;margin-top:2px}
.tile .n{color:var(--ink2);font-size:12px}
.tile{min-width:0}
.tile .v.txt{font:500 20px/1.25 var(--font);letter-spacing:0;text-transform:capitalize;overflow-wrap:anywhere;padding:5px 0 3px}
/* status */
.chip{white-space:nowrap;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:700;border:1px solid currentColor}
.chip.ok{color:#4cd04c}.chip.am{color:var(--warn)}.chip.vm{color:#ff6b6b}.chip.na{color:var(--muted)}
.sem{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.sem .it{background:var(--card2);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:6px}
.sem .nm{font-weight:700}
.sem .dt{color:var(--ink2);font-size:12.5px}
/* tables */
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500;font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;position:sticky;top:0;background:var(--card)}
th:first-child,td:first-child{text-align:left}
td.l,th.l{text-align:left}
tr.dim td{color:var(--muted)}
td{font-variant-numeric:tabular-nums}
.badge{font-size:11px;border:1px solid var(--axis);border-radius:6px;padding:1px 6px;color:var(--ink2)}
.badge.w{color:var(--warn);border-color:var(--warn)}
/* charts */
svg.chart{display:block;touch-action:pan-y;max-width:100%}
.grid{stroke:var(--grid);stroke-width:1}
.axis{stroke:var(--axis);stroke-width:1}
.tick{fill:var(--muted);font:10.5px var(--font)}
.lbl{fill:var(--ink2);font:600 11px var(--font)}
.ref{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1}
.reflbl{fill:var(--ink2);font:10.5px var(--font);paint-order:stroke;stroke:var(--card);stroke-width:3px;stroke-linejoin:round}
.empty{color:var(--muted);margin:8px 0}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin:0 0 8px;font-size:12px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.legend .ln{width:14px;height:0;border-top:2px solid;border-radius:0;vertical-align:3px}
.legend .ring{background:none;border:2px solid var(--muted);border-radius:50%;width:10px;height:10px}
.tbl[hidden],.plot[hidden]{display:none}
/* adherence */
.adh{display:grid;gap:10px}
.adh .row{display:grid;grid-template-columns:130px 1fr 70px;gap:10px;align-items:center}
.track{position:relative;height:12px;background:var(--card2);border-radius:6px;overflow:hidden}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:6px}
.band{position:absolute;top:0;bottom:0;background:rgba(255,255,255,.14)}
.pm{margin:0 0 12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px}.pm summary{cursor:pointer;font-weight:700;min-height:32px;display:flex;align-items:center}.pmb{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:10px 18px;margin-top:10px}.pmact{grid-column:1/-1;display:flex;gap:8px}.pm .grp .k{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}.pmi{display:flex;gap:10px;align-items:center;min-height:36px}.pmi input{width:20px;height:20px}
.plan7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}.pd{background:var(--card2);border-radius:10px;padding:8px 2px;text-align:center;min-width:0}.pd.hoje{outline:1px solid var(--ink2)}.pd .w{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}.pd .pl{font-size:11.5px;color:var(--ink2);margin:2px 0;overflow-wrap:anywhere}.pd .st{font-weight:700;font-size:11.5px}
.adj{margin:8px 0 0;padding:0;list-style:none;display:grid;gap:6px}.adj li{background:var(--card2);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:flex-start}.adj .ic{font-weight:700;line-height:1.45}
.strip{display:flex;height:10px;width:120px;border-radius:3px;overflow:hidden;gap:1px;background:var(--card)}
.strip span{display:block;height:100%}
details{margin-top:8px} summary{cursor:pointer;color:var(--ink2)}
details ul{color:var(--ink2);padding-left:18px;margin:8px 0}
details li{margin-bottom:6px}
/* tooltip */
#tip{position:fixed;left:0;top:0;pointer-events:none;background:#0d0d14;border:1px solid var(--axis);border-radius:8px;padding:8px 10px;font-size:12.5px;z-index:50;max-width:300px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#tip .tv{font-weight:700;font-size:14px;color:var(--ink)}
#tip .t1{color:var(--ink);font-weight:500}
#tip .t2{color:var(--ink2)}
#tip .key{display:inline-block;width:12px;border-top:3px solid;vertical-align:middle;margin-right:6px}
@media (max-width:700px){.filters{position:static;background:none}}
@media (max-width:560px){
  header.top h1{font-size:32px}
  .adh .row{grid-template-columns:1fr 60px}.adh .row .track{grid-column:1/-1;order:3}
  .card{padding:12px}
}
</style>
</head>
<body>

    <button class="primary" id="go" type="submit">Abrir</button>
    <div id="err" role="alert" aria-live="polite"></div>

</main>

"use strict";
/* ============================ utilidades ============================ */
const $=s=>document.querySelector(s);
const el=(t,a={},...k)=>{const e=document.createElement(t);for(const[x,v]of Object.entries(a)){if(x==='class')e.className=v;else if(x==='text')e.textContent=v;else if(x.startsWith('on'))e.addEventListener(x.slice(2),v);else e.setAttribute(x,v)}for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e};
const NS='http://www.w3.org/2000/svg';
const sv=(t,a={},...k)=>{const e=document.createElementNS(NS,t);for(const[x,v]of Object.entries(a))e.setAttribute(x,v);for(const c of k.flat())if(c!=null&&c!==false)e.append(c.nodeType?c:document.createTextNode(String(c)));return e};
const pad=n=>String(n).padStart(2,'0');
const isoOf=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>new Date(+s.slice(0,4),+s.slice(5,7)-1,+s.slice(8,10),12);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const dm=s=>`${s.slice(8,10)}/${s.slice(5,7)}`;
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const fmt=(v,d=1)=>v==null||Number.isNaN(v)?'—':Number(v).toLocaleString('pt-BR',{minimumFractionDigits:d,maximumFractionDigits:d});
const sgn=(v,d=1)=>v==null?'—':(v>0?'+':v<0?'−':'')+fmt(Math.abs(v),d);
const median=a=>{const s=[...a].sort((x,y)=>x-y),m=s.length>>1;return s.length%2?s[m]:(s[m-1]+s[m])/2};
function robust(v){const m=median(v);let sd=1.4826*median(v.map(x=>Math.abs(x-m)));if(sd===0&&v.length>1){const mu=v.reduce((a,b)=>a+b,0)/v.length;sd=Math.sqrt(v.reduce((a,b)=>a+(b-mu)**2,0)/(v.length-1))}return{m,s:sd}}
function niceTicks(min,max,n=4){if(min===max){min-=1;max+=1}const span=max-min,s0=span/n,mag=Math.pow(10,Math.floor(Math.log10(s0))),nr=s0/mag,step=(nr<1.5?1:nr<3?2:nr<7?5:10)*mag;const out=[];for(let v=Math.floor(min/step)*step;v<=Math.ceil(max/step)*step+step*.001;v+=step)out.push(+v.toFixed(10));return out}
const tip=$('#tip');
function showTip(items,cx,cy){tip.textContent='';for(const it of items){const d=el('div',{class:it.c||'t2'});if(it.k)d.append(el('span',{class:'key',style:`border-color:${it.k}`}));d.append(it.t);tip.append(d)}tip.hidden=false;const r=tip.getBoundingClientRect();let x=cx+14,y=cy+14;if(x+r.width>innerWidth-8)x=cx-r.width-14;if(y+r.height>innerHeight-8)y=cy-r.height-14;tip.style.transform=`translate(${Math.max(8,x)}px,${Math.max(8,y)}px)`}
const hideTip=()=>{tip.hidden=true};
document.addEventListener('pointerdown',e=>{if(!e.target.closest||!e.target.closest('svg.chart'))hideTip()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')hideTip()});

  base.forEach((b,i)=>{if(b)run.push(i);else flush()});flush();

function bars(host,o){

  return el('div',{class:'card'},el('details',{},el('summary',{},'Regras de interpretação e caveats (vêm do weekly_summary.py)'),el('ul',{},DATA.regras.map(t=>el('li',{},t))),el('h3',{style:'margin-top:10px'},'Caveats'),el('ul',{},DATA.caveats.map(t=>el('li',{},t)))))}

/* ============================ render ============================ */
const HID=new Set(),HID_KEY='garmin_hidden',RNG_KEY='garmin_range';let prefsLoaded=false,menuOpen=false;
function loadPrefs(){try{const h=JSON.parse(localStorage.getItem(HID_KEY)||'[]');if(Array.isArray(h))h.forEach(x=>HID.add(x));const r=localStorage.getItem(RNG_KEY);if(r!=null&&[0,1,7,28,56,90,140].includes(+r))S.range=+r}catch(e){}}
function savePrefs(){try{localStorage.setItem(HID_KEY,JSON.stringify([...HID]));localStorage.setItem(RNG_KEY,String(S.range))}catch(e){}}
function render(){
  if(!prefsLoaded){prefsLoaded=true;loadPrefs()}
  const app=$('#app'),y=scrollY;app.textContent='';LATER.length=0;
  const w=WK[S.week],gen=new Date(DATA.gerado_em),hrs=(Date.now()-gen)/36e5;
  const wrap=el('div',{class:'wrap'});
  wrap.append(el('header',{class:'top'},el('div',{},el('h1',{},'Garmin · Performance'),
      el('div',{class:'sub'},`Dados até ${dm(DATA.hoje)} · gerado em ${gen.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})} · zonas v${T.versao}`,hrs>36?el('span',{class:'stale'},` · ▲ desatualizado há ${Math.floor(hrs)} h: confira a rotina diária`):null)),
    el('button',{type:'button',onclick:lock},'Bloquear')));
  const sel=el('select',{id:'wsel','aria-label':'Semana'},WK.map((x,i)=>el('option',{value:i},wlabel(x)))),chips=el('div',{class:'chips'});
  sel.value=S.week;sel.addEventListener('change',()=>{S.week=+sel.value;render()});
  [['Off',0],['1 d',1],['7 d',7],['28 d',28],['56 d',56],['90 d',90],['140 d',140]].forEach(([lb,r])=>chips.append(el('button',{type:'button','aria-pressed':String(S.range===r),onclick:()=>{S.range=r;savePrefs();render()}},lb)));
  wrap.append(el('div',{class:'filters'},el('label',{for:'wsel'},'Semana'),sel,el('label',{},'Séries diárias'),chips));
  const GR=[
    [null,[['sem','Semáforo de overreach',()=>secSemaforo(w)],['plano','Estou dentro do plano?',()=>secPlano(w)],['resumo','Resumo da semana',()=>secResumo(w)]]],
    ['Recuperação',[['recw','Recuperação da semana vs baseline',()=>secRecuperacaoSemana(w)],['recs','Séries diárias de recuperação',secRecuperacaoSeries]],'séries diárias · fundo = período escolhido'],
    ['Sono',[['sono','Sono',secSono]],'qualidade, estágios e regularidade'],
    ['Treino',[['zon','Zonas por semana',secZonas],['car','Carga (TRIMP)',secCarga],['ade','Aderência ao plano',()=>secAderencia(w)],['ses','Sessões da semana',()=>secSessoes(w)],['sdet','Análise de uma sessão',secSessao],['res','Resposta pós-treino',()=>secResposta(w)]]],
    ['Calorias',[['cal','Calorias totais e ativas',()=>secCalorias(w)],['efe','Efetividade por treino',()=>secEfetividade(w)]],'gasto diário e efetividade por treino'],
    ['Tendência e Garmin',[['gar','VO₂máx e Garmin',secGarmin],['ten','Tendência semanal',secTendencia]]],
    ['Regras',[['reg','Regras de interpretação',secRegras]]]];
  // menu para ligar/desligar painéis
  const ids=GR.flatMap(g=>g[1].map(p=>p[0])),det=el('details',{class:'pm'});det.open=menuOpen;det.addEventListener('toggle',()=>{menuOpen=det.open});
  det.append(el('summary',{},`Painéis (${ids.length-ids.filter(i=>HID.has(i)).length}/${ids.length} visíveis)`));
  const body=el('div',{class:'pmb'},el('div',{class:'pmact'},el('button',{type:'button',class:'tbtn',onclick:()=>{HID.clear();savePrefs();render()}},'Mostrar tudo'),el('button',{type:'button',class:'tbtn',onclick:()=>{ids.forEach(i=>HID.add(i));savePrefs();render()}},'Ocultar tudo')));
  GR.forEach(g=>{const bx=el('div',{class:'grp'},g[0]?el('div',{class:'k'},g[0]):null);
    g[1].forEach(([id,lb])=>{const cb=el('input',{type:'checkbox',id:'pn_'+id});cb.checked=!HID.has(id);cb.addEventListener('change',()=>{cb.checked?HID.delete(id):HID.add(id);savePrefs();render()});bx.append(el('label',{class:'pmi',for:'pn_'+id},cb,lb))});body.append(bx)});
  det.append(body);wrap.append(det);
  GR.forEach(g=>{const nodes=g[1].filter(p=>!HID.has(p[0])).map(p=>p[2]()).filter(Boolean);
    if(!nodes.length)return;if(g[0])wrap.append(sec(g[0],g[2]));nodes.forEach(n=>wrap.append(n))});
  if(ids.every(i=>HID.has(i)))wrap.append(el('p',{class:'empty'},'Todos os painéis estão ocultos. Abra "Painéis" e ligue os que quiser ver.'));
  app.append(wrap);LATER.splice(0).forEach(f=>f());window.scrollTo(0,y)}
let rt,lastW=document.documentElement.clientWidth;
addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const w=document.documentElement.clientWidth;if(DATA&&Math.abs(w-lastW)>8){lastW=w;render()}},180)});

/* ============================ senha / decifragem ============================ */
const blob=JSON.parse($('#blob').textContent);
const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(pass){
  if(!(window.crypto&&crypto.subtle))throw new Error('insecure');
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64d(blob.salt),iterations:blob.iter,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64d(blob.iv)},key,b64d(blob.ct))))}
function lock(){DATA=null;WK=[];$('#app').textContent='';$('#app').hidden=true;$('#gate').hidden=false;$('#pw').value='';hideTip()}
$('#form').addEventListener('submit',async e=>{
  e.preventDefault();const b=$('#go'),err=$('#err');err.textContent='';b.disabled=true;b.textContent='Decifrando…';
  try{DATA=await decrypt($('#pw').value);T=DATA.zonas;WK=DATA.semanas.concat(DATA.semana_atual?[DATA.semana_atual]:[]);
    if(!WK.length)throw new Error('empty');
    const cur=DATA.semana_atual;S.week=cur&&cur.dias_decorridos>=3?WK.length-1:Math.max(0,WK.length-(cur?2:1));
    $('#gate').hidden=true;$('#app').hidden=false;render()}
  catch(x){DATA=null;err.textContent=x.message==='insecure'?'Este navegador bloqueou a criptografia (abra pelo link https).':x.message==='empty'?'Dados vazios: rode a rotina diária.':'Senha incorreta.'}
  finally{b.disabled=false;b.textContent='Abrir'}});
</script>
